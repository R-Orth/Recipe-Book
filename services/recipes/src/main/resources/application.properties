spring.application.name=recipes
server.port=8081
spring.docker.compose.enabled=false

redis.host=localhost
redis.port=6379

logging.file.name=logs/recipes.log
logging.level.com.chefit.recipes=DEBUG
logging.level.org.springframework.web=INFO

logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5p) %clr([%t]){faint} %clr(%logger{36}){cyan} - %m%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%t] %logger{36} - %m%n
