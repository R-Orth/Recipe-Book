spring.application.name=users
server.port=8083
spring.docker.compose.enabled=false

redis.host=localhost
redis.port=6379

# Must match the secret used by the auth service — validated locally, no auth round-trip.
jwt.secret=${JWT_SECRET:dev-only-chefit-jwt-secret-change-me-32B+}
jwt.expiration-ms=86400000

# Same pepper as auth — used for password verification and change.
password.pepper=${PASSWORD_PEPPER:dev-only-chefit-pepper-change-me}

logging.file.name=logs/users.log
logging.level.com.chefit.users=DEBUG
logging.level.org.springframework.web=INFO

logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5p) %clr([%t]){faint} %clr(%logger{36}){cyan} - %m%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%t] %logger{36} - %m%n
