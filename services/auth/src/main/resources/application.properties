spring.application.name=auth
server.port=8082
spring.docker.compose.enabled=false

redis.host=localhost
redis.port=6379

# Google OAuth (GIS flow) — client id is public; the secret is not used by this flow
google.client-id=642465390637-kcp0hs8k1a4pm4uu75rtkp9l8r5h3cn0.apps.googleusercontent.com

# ChefIt session JWT — HS256. Override jwt.secret via env/secret manager in real deploys.
jwt.secret=${JWT_SECRET:dev-only-chefit-jwt-secret-change-me-32B+}
jwt.expiration-ms=86400000

# Salt + pepper SHA-256. Override password.pepper via env/secret manager in real deploys.
# Rotating the pepper invalidates every stored password by design.
password.pepper=${PASSWORD_PEPPER:dev-only-chefit-pepper-change-me}

logging.file.name=logs/auth.log
logging.level.com.chefit.auth=DEBUG
logging.level.org.springframework.web=INFO

logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5p) %clr([%t]){faint} %clr(%logger{36}){cyan} - %m%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%t] %logger{36} - %m%n
