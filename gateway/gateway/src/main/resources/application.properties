spring.application.name=gateway
server.port=8080
spring.docker.compose.enabled=false

# Downstream service URLs — referenced by route config, overridable per-environment and in tests
recipes.service.url=http://localhost:8081
auth.service.url=http://localhost:8082
users.service.url=http://localhost:8083

# Routes — Spring Cloud 2025.x uses spring.cloud.gateway.server.webflux.* namespace
# Comma-OR predicates cover both the bare path and sub-paths in one predicate
spring.cloud.gateway.server.webflux.routes[0].id=recipes
spring.cloud.gateway.server.webflux.routes[0].uri=${recipes.service.url}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/items,/items/**

spring.cloud.gateway.server.webflux.routes[1].id=auth
spring.cloud.gateway.server.webflux.routes[1].uri=${auth.service.url}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/auth,/auth/**

spring.cloud.gateway.server.webflux.routes[2].id=users
spring.cloud.gateway.server.webflux.routes[2].uri=${users.service.url}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/users,/users/**

# Global CORS — Spring Cloud 2025.x gateway-native CORS (replaces CorsWebFilter bean)
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true

logging.file.name=logs/gateway.log
logging.level.com.chefit.gateway=DEBUG
logging.level.org.springframework.web=INFO

logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5p) %clr([%t]){faint} %clr(%logger{36}){cyan} - %m%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%t] %logger{36} - %m%n
